# Azure DevOps — reusable STAGE template: post-deploy + tests.
#
# Referenced by the infra deploy pipeline. It defines the `PostDeployTest` stage (the Cleanup stage
# depends on this name). The stage:
#   1. Reads the solution's configuration back FROM THE RESOURCE GROUP via `az` (the ARM deployment
#      outputs) — no outputs are passed between stages.
#   2. Hydrates an azd environment + a repo-root .env from those values, so the solution's own
#      post-deploy scripts read config exactly as azd would have written it.
#   3. Runs the discovered post-deploy scripts, in order: build/push the application images and roll
#      out the App Service + Container Instance, then load the sample data.
#   4. Runs the Playwright/e2e suite against the deployed app. Unit tests do NOT run here; they run
#      on every PR in azure-pipelines-bicep-ci.yml.
#
# It never edits the repo's infra / app / post-provision sources.

parameters:
  - name: serviceConnection
    type: string
  - name: resourceGroup
    type: string
  - name: azureEnvName
    type: string
  - name: subscriptionId
    type: string
  - name: dependsOn
    type: string
    default: Provision

stages:
  - stage: PostDeployTest
    displayName: Post-deploy and tests
    dependsOn: ${{ parameters.dependsOn }}
    condition: succeeded()
    variables:
      # The repo's requirements files pin this index; mirrors .github/workflows/test-automation-v2.yml.
      PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple/
    jobs:
      # -------------------------------------------------------------------------------------
      # Post-deploy: hydrate config from the RG, then run the solution's post-deploy scripts.
      # -------------------------------------------------------------------------------------
      - job: post_deploy
        displayName: Run post-deploy scripts
        timeoutInMinutes: 120
        steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Read config from the resource group and hydrate azd env
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              addSpnToEnvironment: true
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                RG='${{ parameters.resourceGroup }}'
                AZD_ENV='${{ parameters.azureEnvName }}'
                export AZURE_SUBSCRIPTION_ID='${{ parameters.subscriptionId }}'

                # Read the deployment outputs back from the resource group — the same values azd
                # would have stored. Pick the latest succeeded deployment.
                DEP="$(az deployment group list --resource-group "$RG" \
                  --query "sort_by([?properties.provisioningState=='Succeeded'], &properties.timestamp)[-1].name" \
                  -o tsv 2>/dev/null || true)"
                if [ -z "$DEP" ] || [ "$DEP" = "None" ]; then
                  echo "No succeeded ARM deployment found in '$RG'; falling back to an empty output set."
                  echo '{}' > infra-outputs.json
                else
                  echo "Reading outputs from deployment: $DEP"
                  az deployment group show --resource-group "$RG" --name "$DEP" \
                    --query properties.outputs -o json > infra-outputs.json
                fi

                # Install azd and reconstruct an environment the post-deploy scripts can read.
                curl -fsSL https://aka.ms/install-azd.sh | bash
                azd version
                azd auth login \
                  --client-id "$servicePrincipalId" \
                  ${servicePrincipalKey:+--client-secret "$servicePrincipalKey"} \
                  ${servicePrincipalKey:+--tenant-id "$tenantId"} \
                  ${servicePrincipalKey:--federated-credential-provider "azure-pipelines"} 1>/dev/null 2>&1 || true

                azd env new "$AZD_ENV" --subscription "$AZURE_SUBSCRIPTION_ID" --no-prompt \
                  || azd env select "$AZD_ENV"
                azd env set AZURE_RESOURCE_GROUP "$RG"
                azd env set RESOURCE_GROUP_NAME "$RG"

                # Bridge every scalar output into the azd env and a repo-root .env. ARM lowercases
                # output keys, so upper-case them to the canonical UPPER_SNAKE names.
                jq -r '
                  to_entries[]
                  | select((.value.value | type) as $t | $t=="string" or $t=="number" or $t=="boolean")
                  | "\(.key | ascii_upcase)\t\(.value.value | tostring)"
                ' infra-outputs.json > kv.tsv || : > kv.tsv

                : > .env
                while IFS="$(printf '\t')" read -r k v; do
                  [ -n "$k" ] || continue
                  azd env set "$k" "$v" || true
                  printf '%s=%s\n' "$k" "$v" >> .env
                  echo "##vso[task.setvariable variable=$k]$v"
                done < kv.tsv
                echo "Hydrated $(wc -l < kv.tsv) output(s) into azd env '$AZD_ENV' and .env."

          - task: UsePythonVersion@0
            displayName: Use Python 3.11
            inputs:
              versionSpec: "3.11"

          - task: Bash@3
            displayName: Install post-deploy Python dependencies
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                python -m pip install uv
                uv pip install --system -r scripts/requirements-post-deploy.txt

          - task: AzureCLI@2
            displayName: Run post-deploy steps
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              addSpnToEnvironment: true
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                export AZURE_ENV_NAME='${{ parameters.azureEnvName }}'
                export AZURE_RESOURCE_GROUP='${{ parameters.resourceGroup }}'
                export AZURE_SUBSCRIPTION_ID='${{ parameters.subscriptionId }}'
                # run_step <runner> <path> [args...]; scripts read config from the azd env / .env.
                run_step() {
                  runner="$1"; path="$2"; shift 2
                  if [ ! -f "$path" ]; then
                    echo "##vso[task.logissue type=error]post-deploy script '$path' not found."; exit 1
                  fi
                  echo "----- $runner $path $*"
                  case "$runner" in
                    bash)   bash "$path" "$@" ;;
                    pwsh)   pwsh -File "$path" "$@" ;;
                    python) python "$path" "$@" ;;
                    *) echo "##vso[task.logissue type=error]unknown runner '$runner' for '$path'"; exit 1 ;;
                  esac
                }
                # 1. Application deploy: build+push the frontend/backend images to ACR, update the
                #    App Service and recreate the Container Instance. The RG argument makes the
                #    script read its config from the deployment outputs instead of prompting.
                run_step bash infra/scripts/build_and_deploy_images.sh "$AZURE_RESOURCE_GROUP"
                # 2. Load the sample data (runs scripts/post_deploy.py --skip-tests).
                run_step bash infra/scripts/process_sample_data.sh

          - task: Bash@3
            displayName: Manual post-steps (reminder)
            condition: always()
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                {
                  echo "### Post-deploy — manual steps not run by CI"
                  echo ""
                  cat <<'REMINDER'
                - **Add App Authentication** — configure App Service authentication as described in
                  `docs/AppAuthentication.md`. This is a portal/app-registration action with no script
                  to invoke, so CI cannot perform it. Changes can take up to 10 minutes to apply.
                  The ephemeral resource group is deleted at the end of every run, so this step is
                  only relevant for a long-lived deployment.
                REMINDER
                } | tee "$(Build.ArtifactStagingDirectory)/manual-post-steps.md"
                # Surface the reminder in the run's Extensions/Summary tab (parity with a step summary).
                echo "##vso[task.uploadsummary]$(Build.ArtifactStagingDirectory)/manual-post-steps.md"

      # -------------------------------------------------------------------------------------
      # Playwright / e2e tests. Runs after the post-deploy job so the deployed app is exercised
      # end-to-end. The suite reads the app URL from the `url` variable (tests/e2e-test/config
      # /constants.py -> os.getenv("url")), which is resolved here from the WEB_APP_URL deployment
      # output. Unit tests are NOT here — they run on every PR in the CI pipeline.
      # -------------------------------------------------------------------------------------
      - job: playwright
        displayName: Playwright / e2e tests
        dependsOn: post_deploy
        condition: succeeded()
        steps:
          - checkout: self
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.11"
          - task: AzureCLI@2
            displayName: Run Playwright (python)
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: tests/e2e-test
              inlineScript: |
                set -euo pipefail
                RG='${{ parameters.resourceGroup }}'
                DEP="$(az deployment group list --resource-group "$RG" \
                  --query "sort_by([?properties.provisioningState=='Succeeded'], &properties.timestamp)[-1].name" \
                  -o tsv)"
                # ARM lower-cases the first token of each output name, so match case-insensitively.
                url="$(az deployment group show --resource-group "$RG" --name "$DEP" \
                  --query "properties.outputs | to_entries(@)[?lower(key)=='web_app_url'].value.value | [0]" -o tsv)"
                if [ -z "$url" ] || [ "$url" = "None" ]; then
                  echo "##vso[task.logissue type=error]WEB_APP_URL not found in the deployment outputs."
                  exit 1
                fi
                export url
                echo "Testing against: $url"

                python -m pip install uv
                uv pip install --system -r requirements.txt
                python -m playwright install --with-deps chromium
                pytest
